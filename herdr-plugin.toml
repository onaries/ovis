id = "devswha.ovis"
name = "Ovis"
version = "0.4.17"
min_herdr_version = "0.9.0"
description = "Ovis, the browser and phone client for herdr: chat and live terminal for every agent pane, remote PCs over SSH, web push alerts"
platforms = ["linux", "macos", "windows"]

# what is missing, in one line, before `bun install` would fail some steps later
[[build]]
command = ["sh", "scripts/preflight.sh"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/preflight.ps1"]
platforms = ["windows"]

[[build]]
command = ["sh", "scripts/with-bun.sh", "install"]
platforms = ["linux", "macos"]

[[build]]
command = ["bun", "install"]
platforms = ["windows"]

[[build]]
command = ["sh", "scripts/with-bun.sh", "run", "build"]
platforms = ["linux", "macos"]

[[build]]
command = ["bun", "run", "build"]
platforms = ["windows"]

# the release's Rust PTY host, checked against its SHA-256; without one, terminals use the Node sidecar
[[build]]
command = ["sh", "scripts/with-bun.sh", "scripts/pty-sidecar.ts", "install"]
platforms = ["linux", "macos"]

# One-shot per herdr start: brings the bridge up if it is not already answering.
[[startup]]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "start"]
platforms = ["linux", "macos"]

[[startup]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "start"]
platforms = ["windows"]

[[actions]]
id = "start"
title = "Start Ovis"
contexts = ["workspace"]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "start"]
platforms = ["linux", "macos"]

[[actions]]
id = "start-windows"
title = "Start Ovis"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "start"]
platforms = ["windows"]

[[actions]]
id = "stop"
title = "Stop Ovis"
contexts = ["workspace"]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "stop"]
platforms = ["linux", "macos"]

[[actions]]
id = "stop-windows"
title = "Stop Ovis"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "stop"]
platforms = ["windows"]

[[actions]]
id = "status"
title = "Ovis status"
contexts = ["workspace"]
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "status"]
platforms = ["linux", "macos"]

[[actions]]
id = "status-windows"
title = "Ovis status"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "status"]
platforms = ["windows"]

[[panes]]
id = "phone"
title = "Phone setup"
placement = "zoomed"
command = ["sh", "scripts/with-bun.sh", "scripts/plugin.ts", "phone-setup"]
platforms = ["linux", "macos"]

[[panes]]
id = "phone-windows"
title = "Phone setup"
placement = "zoomed"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "phone-setup"]
platforms = ["windows"]

[[actions]]
id = "phone"
title = "Phone setup"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "devswha.ovis", "--entrypoint", "phone", "--placement", "zoomed", "--focus"]
platforms = ["linux", "macos"]

[[actions]]
id = "phone-windows"
title = "Phone setup"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "devswha.ovis", "--entrypoint", "phone-windows", "--placement", "zoomed", "--focus"]
platforms = ["windows"]
