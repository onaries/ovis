name = "ovis-push-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"
# Endpoints name push.ovis.sh (the ovis.sh zone must be on the deploying account): no second address.
workers_dev = false
routes = [{ pattern = "push.ovis.sh", custom_domain = true }]

# Workers Logs would keep each request, the sender's address with it: off.
[observability]
enabled = false

# Once a day, delete endpoints unused for ENDPOINT_TTL_SECONDS (worker.ts `expire`).
[triggers]
crons = ["17 3 * * *"]

# APNS_KEY, APNS_KEY_ID, APNS_TEAM_ID and FCM_SERVICE_ACCOUNT are secrets (`wrangler secret put`,
# README.md), never here.
[vars]
APNS_TOPIC = "sh.ovis.app"

# Registrations per address and minute, per Cloudflare location, before any database write
# (README.md). namespace_id is any integer unique to the account.
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1695"

  [ratelimits.simple]
  limit = 10
  period = 60

# The backstop: registrations per minute from all addresses together, per Cloudflare location,
# for many addresses at once. Asked only after an address's own limit lets a registration through.
[[ratelimits]]
name = "REGISTER_GLOBAL_LIMITER"
namespace_id = "1696"

  [ratelimits.simple]
  limit = 60
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "ovis-push-relay"
# database_id: from `wrangler d1 create ovis-push-relay` (README.md), an id, not a secret.
database_id = "1bdfce07-d5b5-40e9-8a56-77cc88b033fa"
