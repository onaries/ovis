name: CLA Assistant
# Asks every commit author of a pull request to sign CLA.md once, by commenting the sign phrase on
# the PR, and records the signature in signatures/cla.json on the `cla-signatures` branch (the
# branch must exist; it holds nothing else). The maintainer and bots are allowlisted.
# pull_request_target runs this file from main with the base repository's token, so a fork's PR
# is checked without a maintainer approving the run. It never checks out or runs the PR's code:
# the action reads the PR's commit authors through the API only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: write
  pull-requests: write
jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    # GitHub-hosted: it needs no toolchain and checks out nothing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The action checks only commit authors, which anyone can set to another account's email, so
      # the account that opened the PR must also author one of its commits and sign. Without a
      # linked account the action falls back to the free-text git author name, which the allowlist
      # would accept (`devswha`, `x[bot]`), and it reads only the first 100 commits. When the
      # maintainer opens a PR from someone else's fork, the fork's owner stands in for the opener;
      # a fork with no personal owner (an organization's, or a deleted one) needs an outside opener.
      # Co-authors are not checked: agents co-author as ordinary accounts (`claude`, `cursoragent`),
      # and the action takes a signature only from a commit author.
      - name: Require a GitHub account on every commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          meta=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.user.login) \(.commits) \(.head.repo.full_name // "-") \(.head.repo.owner.login // "-") \(.head.repo.owner.type // "-")"')
          read -r opener count head_repo head_owner head_type <<<"$meta"
          if [ "$count" -gt 100 ]; then
            echo "::error title=CLA::This pull request has $count commits; the CLA check reads only the first 100. Squash it to 100 commits or fewer and push again."
            exit 1
          fi
          commits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[] | "\(.sha[0:10]) \(.author.login // "")"')
          unlinked=$(awk '$2 == "" { printf "%s ", $1 }' <<<"$commits")
          if [ -n "$unlinked" ]; then
            echo "::error title=CLA::Commits $unlinked have no GitHub account as their author, so the CLA cannot be checked. Commit with an email linked to your GitHub account (git commit --amend --reset-author) and push again."
            exit 1
          fi
          exempt() { [ "$1" = devswha ] || [[ "$1" == *"[bot]" ]]; }
          authored() { awk -v o="$1" '$2 == o { found = 1 } END { exit !found }' <<<"$commits"; }
          if ! exempt "$opener" && ! authored "$opener"; then
            echo "::error title=CLA::No commit in this pull request is authored by @$opener, who opened it, so @$opener cannot sign the CLA here. Add a commit made with an email linked to @$opener's GitHub account and push again."
            exit 1
          fi
          if exempt "$opener" && [ "$head_repo" != "$REPO" ] && ! exempt "$head_owner"; then
            if [ "$head_type" != User ]; then
              echo "::error title=CLA::This pull request comes from $head_repo, which has no personal owner to sign the CLA. Ask the contributor to open it from their own account."
              exit 1
            fi
            if ! authored "$head_owner"; then
              echo "::error title=CLA::No commit in this pull request is authored by @$head_owner, whose fork $head_repo it comes from, so @$head_owner cannot sign the CLA here. Add a commit made with an email linked to @$head_owner's GitHub account and push again."
              exit 1
            fi
          fi
      - name: Check and record CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/devswha/ovis/blob/main/CLA.md
          branch: cla-signatures
          allowlist: devswha,*[bot],web-flow
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, every commit author needs to sign our [Contributor License Agreement (CLA)](https://github.com/devswha/ovis/blob/main/CLA.md).

            **To sign the CLA**, comment on this PR with:
            ```
            I have read the CLA Document and I hereby sign the CLA
            ```

            You sign once, and it covers your later pull requests. Comment `recheck` to run the check again.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
