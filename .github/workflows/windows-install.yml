name: Windows install
# The real installer on a clean Windows PC: herdr's and Bun's own installers, herdr's plugin build,
# the app's first start, and an update. CI's "Native Windows install" job checks install.ps1's
# decisions against stand-ins and downloads, builds and starts nothing.
#
# A pull request that touches what an install runs installs its own commit. Once a week the README's
# command installs the latest release, and the release before it updates to it: herdr's and Bun's
# installers change without a commit here. Everything comes from the network, so this is not a
# required check.
on:
  pull_request:
    paths:
      - 'install.ps1'
      - 'herdr-plugin.toml'
      - 'scripts/plugin.ps1'
      - 'scripts/plugin.ts'
      - 'scripts/preflight.ps1'
      - 'scripts/windows-install-e2e.ps1'
      - 'server/managed.ts'
      - 'server/supervisor.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/windows-install.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-install-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  install:
    name: Real Windows install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # a pull request's default checkout is its merge with main: install.ps1 would be one commit and -Ref another
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # no setup-bun: a PC that has neither herdr nor Bun is the case under test
      - name: Install this commit
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install-e2e.ps1 -Ref $env:HEAD_SHA -Fresh
      - name: Install the latest release with the README's command
        if: github.event_name != 'pull_request'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install-e2e.ps1 -Installer https://herdrweb.dev/install.ps1 -Fresh
      - name: Update from the release before it
        if: github.event_name != 'pull_request'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install-e2e.ps1 -Installer https://herdrweb.dev/install.ps1 -Update
