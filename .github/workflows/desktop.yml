name: Desktop app
# Builds Ovis for the desktop (app/electron) on Linux x64 and macOS arm64: its unit tests, its type
# check, then an unsigned AppImage, or dmg and zip, kept as the run's artifacts. Nothing is
# published. A pull request touching the app runs it; run it by hand for any branch.
on:
  pull_request:
    paths:
      - 'app/electron/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the client's packages
        run: bun install --frozen-lockfile
      - name: Install the app's packages
        working-directory: app/electron
        run: bun install --frozen-lockfile
      - name: Unit tests
        working-directory: app/electron
        run: bun test
      - name: Type check
        working-directory: app/electron
        run: bun run typecheck
      - name: Build ${{ matrix.target }}
        working-directory: app/electron
        env:
          # unsigned: signing and notarizing come with the release job
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ovis-desktop-${{ matrix.target }}
          path: |
            app/electron/dist/Ovis-*
          if-no-files-found: error
