name: Website
# Builds site/ into the GitHub Pages site (https://herdrweb.dev/) after CI succeeds for a push to
# main: the installers, the pages that forward to https://ovis.sh/, and the browser demo, which is
# the app itself, so any client change is a site change.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    name: Validate source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    # light: same-repository runs take the self-hosted pool, fork pull requests stay GitHub-hosted (scripts/light-runner-workflow.test.ts)
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(github.ref == 'refs/heads/main' && vars.CI_MAIN_SELF_HOSTED_LABELS || vars.CI_LIGHT_LABELS || vars.CI_SELF_HOSTED_LABELS || '["self-hosted","self-hosted-ovis"]') }}
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      # the demo is a Vite build of the client
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-site.ts
      - id: source
        name: Record built SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  # Whether the built commit is still main's head, in a job with no environment: a run that main has moved past
  # skips the deploy job instead of recording a deployment it never made, and ends with a notice, not red.
  current:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.validate.result == 'success' ||
      (needs.validate.result == 'skipped' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    needs: [validate, build]
    # light: same-repository runs take the self-hosted pool, fork pull requests stay GitHub-hosted (scripts/light-runner-workflow.test.ts)
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(github.ref == 'refs/heads/main' && vars.CI_MAIN_SELF_HOSTED_LABELS || vars.CI_LIGHT_LABELS || vars.CI_SELF_HOSTED_LABELS || '["self-hosted","self-hosted-ovis"]') }}
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.current.outputs.stale }}
    steps:
      - name: Check the built commit is main's head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$BUILT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Built SHA $BUILT_SHA does not match validated SHA $EXPECTED_SHA" >&2
            exit 1
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid main SHA: $latest_sha" >&2
            exit 1
          fi
          if [[ "$latest_sha" != "$EXPECTED_SHA" ]]; then
            echo "::notice title=Deployment skipped::This run built $EXPECTED_SHA, and main is now $latest_sha, so it deploys nothing."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"
  deploy:
    if: >-
      always() && needs.current.result == 'success' && needs.current.outputs.stale == 'false' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.validate.result == 'success' ||
      (needs.validate.result == 'skipped' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    needs: [validate, build, current]
    # light: same-repository runs take the self-hosted pool, fork pull requests stay GitHub-hosted (scripts/light-runner-workflow.test.ts)
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON(github.ref == 'refs/heads/main' && vars.CI_MAIN_SELF_HOSTED_LABELS || vars.CI_LIGHT_LABELS || vars.CI_SELF_HOSTED_LABELS || '["self-hosted","self-hosted-ovis"]') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # checked again right before deploying: main can move on after the current job read it
      - name: Verify deployment SHA is current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$BUILT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Built SHA $BUILT_SHA does not match validated SHA $EXPECTED_SHA" >&2
            exit 1
          fi
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid main SHA: $latest_sha" >&2
            exit 1
          fi
          if [[ "$latest_sha" != "$EXPECTED_SHA" ]]; then
            echo "Refusing to deploy outdated SHA $EXPECTED_SHA; main is now $latest_sha" >&2
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Summarize deployment
        if: success()
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            printf 'Validated SHA: `%s`\n' "$VALIDATED_SHA"
            printf 'Built SHA: `%s`\n' "$BUILT_SHA"
            printf 'Deployed SHA: `%s`\n' "$DEPLOYED_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
