appId: sh.ovis.desktop
productName: Ovis
copyright: Copyright (c) 2026 devswha
directories:
  output: dist
files:
  - out/**
  - renderer/**
  - package.json
extraResources:
  # herdr-core, Bun and the Ovis server, staged by scripts/build.ts; outside the asar so they run
  - from: stage
    to: ovis
  - from: ../assets/icon-only.png
    to: icon.png
icon: ../assets/icon-only.png
npmRebuild: false
# the installers' names carry no version (Ovis-linux-x64.AppImage, Ovis-linux-x64.deb, Ovis-mac-arm64.dmg, Ovis-win-x64.exe)
# so releases/latest/download/<name> always links the newest: scripts/build.ts sets artifactName per build
toolsets:
  # the static AppImage runtime, which needs no libfuse2 (gone from recent Ubuntu)
  appimage: '1.0.3'
# notarize and staple the signed macOS app, then the dmg made from it (scripts/notarize-dmg.mjs)
afterSign: ./scripts/notarize-app.mjs
artifactBuildCompleted: ./scripts/notarize-dmg.mjs
linux:
  target:
    - AppImage
    - deb
  category: Development
  # 16 to 512 pixels, made by scripts/build.ts from ../assets/icon-only.png: hicolor lists no 1024 folder
  icon: .cache/linux-icons
  synopsis: Your coding agents in one app
  executableName: ovis
  syncDesktopName: true
  maintainer: devswha <devswha@users.noreply.github.com>
deb:
  # stops the herdr-core server the app started for the user removing the package (linux/before-remove.sh)
  fpm:
    - --before-remove
    - linux/before-remove.sh
  # electron-builder's own list, which lacks ALSA (Electron needs libasound.so.2), with the t64 names
  # newer Ubuntu and Debian gave some of them first
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Developer ID signing from CSC_LINK + CSC_KEY_PASSWORD or CSC_NAME, and notarization from
  # APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER (scripts/notarize-dmg.mjs); unsigned without them.
  # The afterSign hook notarizes the app: electron-builder's own stapling gives up within seconds.
  notarize: false
  # Signed under the hardened runtime (electron-builder's default): the app takes build/entitlements.mac.plist
  # and everything else inside build/entitlements.mac.inherit.plist, found by name. Resources holds the server's files too: sign only its programs (hc, Bun, the server's binary, the PTY host)
  # and native modules, not every data file in them. A new Mach-O there that this misses fails notarization.
  # signs the PTY host first and brings its record up to the signed bytes (scripts/sign-mac.mjs)
  sign: ./scripts/sign-mac.mjs
  signIgnore:
    - '/Contents/Resources/(?!ovis/bin/|ovis/server/bin/|ovis/server/ovis-server$)(?!.*(\.node|\.dylib|/spawn-helper)$)'
  extendInfo:
    NSMicrophoneUsageDescription: Ovis uses the microphone for dictation.
dmg:
  sign: true
  # electron-updater updates a Mac from the zip; the dmg is changed after it is built (notarized and stapled)
  writeUpdateInfo: false
win:
  target: nsis
  # made by scripts/build.ts from ../assets/icon-only.png
  icon: .cache/icon.ico
nsis:
  # per user, no administrator prompt: the core and the server run as the user anyway
  oneClick: true
  perMachine: false
  # replaces the one-file Windows setup app (README.md)
  include: windows/installer.nsh
