<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Ovis, the browser and phone client for herdr. Chat with your coding agents and use live herdr terminals." />
    <meta property="og:title" content="Ovis" />
    <meta property="og:description" content="Your agents. Any screen. Chat, terminal and mobile access for herdr." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ovis.sh/assets/og-icon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Ovis app icon, a sleepy sheep on navy, above the name Ovis." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1f1f1f" />
    <meta name="color-scheme" content="dark" />
    <!-- The app ships its own i18n (Settings → Language); keep Chrome from
         auto-translating the shell, which garbles terminal output and code. -->
    <meta name="google" content="notranslate" />
    <!-- The query is a URL no pre-0.3.32 service worker has cached: those serve the plain
         URL cache-first, which handed Chrome the old `orientation: "any"` manifest on the
         first launch after an upgrade and spent that day's installed-app update check.
         use-credentials: a browser fetches the manifest without cookies otherwise, and a
         proxy that signs every request in answers that with its login page, not the app. -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" crossorigin="use-credentials" />
    <link rel="icon" href="/favicon.ico?v=sheep1" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png?v=sheep1" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=sheep1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Leave apple-mobile-web-app-status-bar-style unset to use the normal home-screen
         status-bar layout instead of drawing beneath it (#164). Existing installs and
         viewport behavior need separate checks; see docs/ios-home-screen-testing.md. -->
    <meta name="apple-mobile-web-app-title" content="Ovis" />
    <title>Ovis</title>
  </head>
  <body>
    <!-- What a slow link shows until the app's script runs: React's first frame replaces it (#2329) -->
    <div id="root"><div class="boot" role="status"><div class="boot-spinner" aria-hidden="true"></div><span class="visually-hidden">Loading Ovis</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/pwa.ts"></script>
  </body>
</html>
